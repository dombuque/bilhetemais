openapi: 3.0.3
info:
  title: Bilhete+ API
  version: 0.1.0
  description: |
    Gerado automaticamente a partir das rotas (`npm run openapi`). Valores monetários em **centavos inteiros** (string ou número).
    Autenticação: `Authorization: Bearer <token>` obtido em `POST /auth/login`. As rotas indicam as funções permitidas.
    Os pedidos de pagamento aceitam `idempotencyKey`: repetir o mesmo pedido nunca debita duas vezes.
servers: [{ url: / }]
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
paths:
  /audit:
    get:
      tags: [audit]
      operationId: get_audit
      description: "Funções: ORG_ADMIN."
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Dados inválidos }
        '401': { description: Não autenticado }
        '403': { description: Sem permissão ou empresa não aprovada }
        '404': { description: Não encontrado (inclui recursos de outra empresa) }
  /auth/login:
    post:
      tags: [auth]
      operationId: post_auth_login
      description: "Público."
      responses:
        '200': { description: OK }
        '400': { description: Dados inválidos }
