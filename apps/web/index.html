<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bilhete+" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <title>Bilhete+</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* ecrã de arranque: aparece logo, antes de qualquer código, para a app nunca ficar em branco com internet lenta */
      html, body { margin: 0; background: #0b0820; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b0820; color: #c9c6e2; font: 600 .95rem system-ui, sans-serif; text-align: center; padding: 24px; z-index: 1; }
      .boot img { width: 84px; height: 84px; border-radius: 20px; }
      .boot-ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgb(255 255 255 / .18); border-top-color: #5ce1ff; animation: bootspin .8s linear infinite; }
      .boot button { margin-top: 6px; min-height: 46px; padding: 0 22px; border-radius: 12px; border: 0; background: #5ce1ff; color: #0b0820; font: 700 .95rem system-ui, sans-serif; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-ring { animation-duration: 2.4s; } }
    </style>
    <script>
      /* se um ficheiro da app falhar (versão antiga em cache), relê-se uma vez e a página nunca fica em branco */
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) { try { if (sessionStorage.getItem('bp_reload')) return; sessionStorage.setItem('bp_reload', '1'); } catch (x) { return; } if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }).then(function () { return caches.keys(); }).then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).finally(function () { location.reload(); }); else location.reload(); }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"><div class="boot" id="boot"><img src="/icon-192.png" alt="" width="84" height="84" /><div class="boot-ring" role="status" aria-label="A carregar"></div><span id="boot-msg">A carregar…</span></div></div>
    <script>setTimeout(function () { var m = document.getElementById("boot-msg"), b = document.getElementById("boot"); if (m && b) { m.textContent = "A ligação está lenta. A continuar a carregar…"; var x = document.createElement("button"); x.textContent = "Tentar de novo"; x.onclick = function () { location.reload(); }; b.appendChild(x); } }, 8000);</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
