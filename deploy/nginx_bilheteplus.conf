# Bilhete+ — site novo, independente dos existentes. O certbot acrescenta o bloco HTTPS:
#     certbot --nginx -d bilhetemais.semfila.online
server {
    listen 80;
    server_name bilhetemais.semfila.online;

    # imagens (≤1 MB) e documentos (≤3 MB) vão para a base de dados
    client_max_body_size 4m;

    # compressão (o Nginx por omissão só comprime HTML) — essencial em ligações móveis e distantes
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# Subdomínios por evento (<evento>.bilhetemais.semfila.online) exigem DNS wildcard e certificado wildcard (DNS-01 na Cloudflare).
# Sem isso, as páginas dos eventos funcionam em https://bilhetemais.semfila.online/e/<evento>.
# HTTP/2 (menos viagens em ligações lentas): depois do certbot, em «listen 443 ssl;» acrescente «http2» (Nginx 1.24): listen 443 ssl http2;
