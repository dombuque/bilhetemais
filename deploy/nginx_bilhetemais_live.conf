# Bilhete+ em bilhetemais.live: o endereço principal e UM SUBDOMÍNIO POR EVENTO (<evento>.bilhetemais.live),
# criados automaticamente (basta existir o evento: o DNS e o certificado são curinga).
#
# Pré-requisitos (ver docs/07-dominio-bilhetemais-live.md):
#   1. DNS: registos A  @  e  *  →  IP do servidor.
#   2. Certificado curinga (Let's Encrypt, validação DNS-01) em /etc/letsencrypt/live/bilhetemais.live/
server {
    listen 80;
    listen [::]:80;
    server_name bilhetemais.live *.bilhetemais.live;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bilhetemais.live *.bilhetemais.live;

    ssl_certificate     /etc/letsencrypt/live/bilhetemais.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilhetemais.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # imagens (≤1 MB) e documentos (≤3 MB) vão para a base de dados
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
